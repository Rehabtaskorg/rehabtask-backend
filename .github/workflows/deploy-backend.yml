name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    branches:
      - main
      - staging
      - development

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: rehabtask-repo

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: lint
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_BACKEND }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "574.0.0"

      - name: Set environment-specific variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "SERVICE_NAME=rehabtask-backend" >> $GITHUB_ENV
            echo "RUNTIME_SA=rehabtask-backend-prod@rehabtask-db9bb.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "IS_PROD=true" >> $GITHUB_ENV
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://rehabtask.com" >> $GITHUB_ENV
            echo "API_URL=https://api.rehabtask.com" >> $GITHUB_ENV
            echo "COOKIE_SECURE=true" >> $GITHUB_ENV
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_PROD }}" >> $GITHUB_ENV
            echo "DB_SECRET=DATABASE_URL_PROD" >> $GITHUB_ENV
            echo "DIRECT_DB_SECRET=DIRECT_DATABASE_URL_PROD" >> $GITHUB_ENV
            echo "SUPABASE_ROLE_SECRET=SUPABASE_SERVICE_ROLE_KEY_PROD" >> $GITHUB_ENV
            echo "STRIPE_SECRET=STRIPE_SECRET_KEY_PROD" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET_PROD" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_CONNECT_SECRET=STRIPE_WEBHOOK_SECRET_CONNECT_PROD" >> $GITHUB_ENV
            echo "RESEND_SECRET=RESEND_API_KEY_PROD" >> $GITHUB_ENV
            echo "STRIPE_PRICE_PRO_MONTHLY=${{ secrets.STRIPE_PRICE_PRO_MONTHLY_PROD }}" >> $GITHUB_ENV
            echo "STRIPE_PRICE_ENTERPRISE_MONTHLY=${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY_PROD }}" >> $GITHUB_ENV
            echo "STRIPE_PRICE_UNLIMITED_MONTHLY=${{ secrets.STRIPE_PRICE_UNLIMITED_MONTHLY_PROD }}" >> $GITHUB_ENV
            echo "MIN_INSTANCES=1" >> $GITHUB_ENV
            echo "MAX_INSTANCES=10" >> $GITHUB_ENV
            echo "IDENTITY_PLATFORM_TENANT_SECRET=IDENTITY_PLATFORM_TENANT_ID_PROD" >> $GITHUB_ENV
            echo "PROFILE_IMAGES_BUCKET_SECRET=PROFILE_IMAGES_BUCKET_PROD" >> $GITHUB_ENV
            echo "THERAPIST_DOCUMENTS_BUCKET_SECRET=THERAPIST_DOCUMENTS_BUCKET_PROD" >> $GITHUB_ENV
            echo "AGENCY_DOCUMENTS_BUCKET_SECRET=AGENCY_DOCUMENTS_BUCKET_PROD" >> $GITHUB_ENV
            echo "INDIVIDUAL_DOCUMENTS_BUCKET_SECRET=INDIVIDUAL_DOCUMENTS_BUCKET_PROD" >> $GITHUB_ENV
            echo "MESSAGE_ATTACHMENTS_BUCKET_SECRET=MESSAGE_ATTACHMENTS_BUCKET_PROD" >> $GITHUB_ENV
            echo "POSTHOG_SECRET=POSTHOG_API_KEY" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "SERVICE_NAME=rehabtask-backend-staging" >> $GITHUB_ENV
            echo "RUNTIME_SA=rehabtask-backend-staging@rehabtask-db9bb.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "IS_PROD=false" >> $GITHUB_ENV
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://staging.rehabtask.com" >> $GITHUB_ENV
            echo "API_URL=https://api-staging.rehabtask.com" >> $GITHUB_ENV
            echo "COOKIE_SECURE=true" >> $GITHUB_ENV
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_STAGING }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_STAGING }}" >> $GITHUB_ENV
            echo "DB_SECRET=DATABASE_URL_STAGING" >> $GITHUB_ENV
            echo "DIRECT_DB_SECRET=DIRECT_DATABASE_URL_STAGING" >> $GITHUB_ENV
            echo "SUPABASE_ROLE_SECRET=SUPABASE_SERVICE_ROLE_KEY_STAGING" >> $GITHUB_ENV
            echo "STRIPE_SECRET=STRIPE_SECRET_KEY_STAGING" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET_STAGING" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_CONNECT_SECRET=STRIPE_WEBHOOK_SECRET_CONNECT_STAGING" >> $GITHUB_ENV
            echo "RESEND_SECRET=RESEND_API_KEY_STAGING" >> $GITHUB_ENV
            echo "STRIPE_PRICE_PRO_MONTHLY=${{ secrets.STRIPE_PRICE_PRO_MONTHLY_STAGING }}" >> $GITHUB_ENV
            echo "STRIPE_PRICE_ENTERPRISE_MONTHLY=${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY_STAGING }}" >> $GITHUB_ENV
            echo "STRIPE_PRICE_UNLIMITED_MONTHLY=${{ secrets.STRIPE_PRICE_UNLIMITED_MONTHLY_STAGING }}" >> $GITHUB_ENV
            echo "MIN_INSTANCES=0" >> $GITHUB_ENV
            echo "MAX_INSTANCES=10" >> $GITHUB_ENV
            echo "IDENTITY_PLATFORM_TENANT_SECRET=IDENTITY_PLATFORM_TENANT_ID_STAGING" >> $GITHUB_ENV
            echo "PROFILE_IMAGES_BUCKET_SECRET=PROFILE_IMAGES_BUCKET_STAGING" >> $GITHUB_ENV
            echo "THERAPIST_DOCUMENTS_BUCKET_SECRET=THERAPIST_DOCUMENTS_BUCKET_STAGING" >> $GITHUB_ENV
            echo "AGENCY_DOCUMENTS_BUCKET_SECRET=AGENCY_DOCUMENTS_BUCKET_STAGING" >> $GITHUB_ENV
            echo "INDIVIDUAL_DOCUMENTS_BUCKET_SECRET=INDIVIDUAL_DOCUMENTS_BUCKET_STAGING" >> $GITHUB_ENV
            echo "MESSAGE_ATTACHMENTS_BUCKET_SECRET=MESSAGE_ATTACHMENTS_BUCKET_STAGING" >> $GITHUB_ENV
            echo "POSTHOG_SECRET=" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "SERVICE_NAME=rehabtask-backend-dev" >> $GITHUB_ENV
            echo "RUNTIME_SA=rehabtask-backend-dev@rehabtask-db9bb.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "IS_PROD=false" >> $GITHUB_ENV
            echo "NODE_ENV=development" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://dev.rehabtask.com" >> $GITHUB_ENV
            echo "API_URL=https://api-dev.rehabtask.com" >> $GITHUB_ENV
            echo "COOKIE_SECURE=false" >> $GITHUB_ENV
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV }}" >> $GITHUB_ENV
            echo "DB_SECRET=DATABASE_URL_DEV" >> $GITHUB_ENV
            echo "DIRECT_DB_SECRET=DIRECT_DATABASE_URL_DEV" >> $GITHUB_ENV
            echo "SUPABASE_ROLE_SECRET=SUPABASE_SERVICE_ROLE_KEY_DEV" >> $GITHUB_ENV
            echo "STRIPE_SECRET=STRIPE_SECRET_KEY_DEV" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET_DEV" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_CONNECT_SECRET=STRIPE_WEBHOOK_SECRET_CONNECT_DEV" >> $GITHUB_ENV
            echo "RESEND_SECRET=RESEND_API_KEY_DEV" >> $GITHUB_ENV
            echo "STRIPE_PRICE_PRO_MONTHLY=${{ secrets.STRIPE_PRICE_PRO_MONTHLY_DEV }}" >> $GITHUB_ENV
            echo "STRIPE_PRICE_ENTERPRISE_MONTHLY=${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY_DEV }}" >> $GITHUB_ENV
            echo "STRIPE_PRICE_UNLIMITED_MONTHLY=${{ secrets.STRIPE_PRICE_UNLIMITED_MONTHLY_DEV }}" >> $GITHUB_ENV
            echo "MIN_INSTANCES=0" >> $GITHUB_ENV
            echo "MAX_INSTANCES=10" >> $GITHUB_ENV
            echo "IDENTITY_PLATFORM_TENANT_SECRET=IDENTITY_PLATFORM_TENANT_ID_DEV" >> $GITHUB_ENV
            echo "PROFILE_IMAGES_BUCKET_SECRET=PROFILE_IMAGES_BUCKET_DEV" >> $GITHUB_ENV
            echo "THERAPIST_DOCUMENTS_BUCKET_SECRET=THERAPIST_DOCUMENTS_BUCKET_DEV" >> $GITHUB_ENV
            echo "AGENCY_DOCUMENTS_BUCKET_SECRET=AGENCY_DOCUMENTS_BUCKET_DEV" >> $GITHUB_ENV
            echo "INDIVIDUAL_DOCUMENTS_BUCKET_SECRET=INDIVIDUAL_DOCUMENTS_BUCKET_DEV" >> $GITHUB_ENV
            echo "MESSAGE_ATTACHMENTS_BUCKET_SECRET=MESSAGE_ATTACHMENTS_BUCKET_DEV" >> $GITHUB_ENV
            echo "POSTHOG_SECRET=" >> $GITHUB_ENV
          fi

      - name: Sanitize branch name for image tag
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "BRANCH_TAG=$BRANCH" >> $GITHUB_ENV

      - name: Capture current serving revision
        run: |
          PREVIOUS_REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "PREVIOUS_REVISION=$PREVIOUS_REVISION" >> $GITHUB_ENV
          echo "Previous revision: $PREVIOUS_REVISION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-backend-${{ hashFiles('**/package-lock.json', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.BRANCH_TAG }}-${{ github.sha }}"
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --platform linux/amd64 \
            --push \
            -t $IMAGE \
            .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Step 1 — Deploy image without VPC (no traffic)
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.BRANCH_TAG }}-${{ github.sha }}"
          SECRETS="DATABASE_URL=${{ env.DB_SECRET }}:latest,DIRECT_DATABASE_URL=${{ env.DIRECT_DB_SECRET }}:latest,SUPABASE_SERVICE_ROLE_KEY=${{ env.SUPABASE_ROLE_SECRET }}:latest,STRIPE_SECRET_KEY=${{ env.STRIPE_SECRET }}:latest,STRIPE_WEBHOOK_SECRET=${{ env.STRIPE_WEBHOOK_SECRET }}:latest,STRIPE_WEBHOOK_SECRET_CONNECT=${{ env.STRIPE_WEBHOOK_CONNECT_SECRET }}:latest,RESEND_API_KEY=${{ env.RESEND_SECRET }}:latest,RECAPTCHA_API_KEY=RECAPTCHA_API_KEY:latest,RECAPTCHA_SITE_KEY=RECAPTCHA_SITE_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,IDENTITY_PLATFORM_TENANT_ID=${{ env.IDENTITY_PLATFORM_TENANT_SECRET }}:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,PROFILE_IMAGES_BUCKET=${{ env.PROFILE_IMAGES_BUCKET_SECRET }}:latest,THERAPIST_DOCUMENTS_BUCKET=${{ env.THERAPIST_DOCUMENTS_BUCKET_SECRET }}:latest,AGENCY_DOCUMENTS_BUCKET=${{ env.AGENCY_DOCUMENTS_BUCKET_SECRET }}:latest,INDIVIDUAL_DOCUMENTS_BUCKET=${{ env.INDIVIDUAL_DOCUMENTS_BUCKET_SECRET }}:latest,MESSAGE_ATTACHMENTS_BUCKET=${{ env.MESSAGE_ATTACHMENTS_BUCKET_SECRET }}:latest,CLOUD_SCHEDULER_SECRET=CLOUD_SCHEDULER_SECRET:latest"
          if [[ -n "${{ env.POSTHOG_SECRET }}" ]]; then
            SECRETS="$SECRETS,POSTHOG_API_KEY=${{ env.POSTHOG_SECRET }}:latest"
          fi
          if [[ "${{ env.IS_PROD }}" == "true" ]]; then
            SERVICE_EXISTS=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --format="value(name)" 2>/dev/null || echo "")
            NO_TRAFFIC_FLAG="--no-traffic"
            if [[ -z "$SERVICE_EXISTS" ]]; then
              NO_TRAFFIC_FLAG=""
            fi
          else
            NO_TRAFFIC_FLAG="--no-traffic"
          fi
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$IMAGE" \
            --platform=managed \
            --region=${{ env.REGION }} \
            --port=8080 \
            --min-instances=${{ env.MIN_INSTANCES }} \
            --max-instances=${{ env.MAX_INSTANCES }} \
            --memory=512Mi \
            --cpu=1 \
            --service-account=${{ env.RUNTIME_SA }} \
            $NO_TRAFFIC_FLAG \
            --async \
            --timeout=300 \
            --set-env-vars "NODE_ENV=${{ env.NODE_ENV }},FRONTEND_URL=${{ env.FRONTEND_URL }},API_URL=${{ env.API_URL }},COOKIE_SECURE=${{ env.COOKIE_SECURE }},SUPABASE_URL=${{ env.SUPABASE_URL }},SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }},RECAPTCHA_MIN_SCORE=0.5,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},PLATFORM_FEE_PERCENTAGE=10,OFFER_EXPIRY_HOURS=48,AUTO_CONFIRM_HOURS=72,DEFAULT_SERVICE_RADIUS_MILES=25,EMAIL_FROM=RehabTask <noreply@rehabtask.com>,EMAIL_FROM_NAME=RehabTask,EMAIL_REPLY_TO=support@rehabtask.com,ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }},STRIPE_PRICE_PRO_MONTHLY=${{ env.STRIPE_PRICE_PRO_MONTHLY }},STRIPE_PRICE_ENTERPRISE_MONTHLY=${{ env.STRIPE_PRICE_ENTERPRISE_MONTHLY }},STRIPE_PRICE_UNLIMITED_MONTHLY=${{ env.STRIPE_PRICE_UNLIMITED_MONTHLY }}" \
            --set-secrets "$SECRETS" \
            --quiet
          echo "Waiting for revision registration..."
          sleep 15
          echo "Step 1 complete — revision created without VPC"

      - name: Step 2 — Apply VPC egress via services update
        run: |
          echo "Waiting 30s before applying VPC config..."
          sleep 30
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --quiet
          echo "Step 2 complete — VPC egress applied via update path"

      - name: Health check and traffic switch
        run: |
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.latestCreatedRevisionName)")
          echo "Polling revision: $REVISION"
          for i in {1..18}; do
            STATUS=$(gcloud run revisions describe $REVISION \
              --region=${{ env.REGION }} \
              --format="value(status.conditions[0].status)")
            if [[ "$STATUS" == "True" ]]; then
              echo "Revision $REVISION is healthy."
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region=${{ env.REGION }} \
                --to-revisions=$REVISION=100
              echo "Traffic switched. Deploy complete."
              exit 0
            fi
            echo "Attempt $i: not ready. Waiting 20s..."
            sleep 20
          done
          echo "Revision failed health check."
          if [[ -n "${{ env.PREVIOUS_REVISION }}" ]]; then
            echo "Rolling back to ${{ env.PREVIOUS_REVISION }}..."
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=${{ env.PREVIOUS_REVISION }}=100
            echo "Rolled back."
          else
            echo "No previous revision — manual intervention required."
          fi
          exit 1
